name: attendance_app
description: "Offline-First Employee Attendance & Field Workforce Tracking Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  image: ^4.2.0

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local Database / Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Hardware & Location
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  camera: ^0.10.5+9
  device_info_plus: ^10.1.0

  # Data Exporting
  csv: ^6.0.0
  excel: ^4.0.3
  pdf: ^3.10.8
  printing: ^5.13.1

  # Network & Utilities
  uuid: ^4.3.3
  connectivity_plus: ^6.0.3

  # Firebase Services
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1

  # Supabase Backend Services
  supabase_flutter: ^2.8.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
